<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Night Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f2f2f5;
    --card: #ffffff;
    --title: #111114;
    --hint: #6e6e76;
    --night: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .card {
    width: min(384px, 100%);
    padding: 22px 22px 24px;
    border-radius: 30px;
    background: var(--card);
    box-shadow:
      0 0 0 1px rgba(0,0,0,calc(0.05 * (1 - var(--night)))),
      0 1px 2px rgba(0,0,0,.04),
      0 18px 40px -12px rgba(20,20,40,.22),
      0 40px 80px -30px rgba(20,20,40,.25);
    position: relative;
    isolation: isolate;
    user-select: none;
    -webkit-user-select: none;
  }
  /* soft night bloom inside the card */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 70% at 50% 20%, rgba(120,130,200,.16), transparent 70%);
    opacity: var(--night);
    pointer-events: none;
    z-index: -1;
  }

  /* ---------- the switch ---------- */
  .track {
    position: relative;
    width: 100%;
    aspect-ratio: 2.55 / 1;
    border-radius: 999px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    outline: none;
    background: #3b7bd6;
    transform: translateZ(0);
    -webkit-mask-image: -webkit-radial-gradient(white, black); /* safari clip fix */
  }
  .track.dragging { cursor: grabbing; }
  .track:focus-visible { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px #6aa2ff; }

  .layer { position: absolute; inset: 0; pointer-events: none; }

  .glow {
    position: absolute;
    left: 0; top: 0;
    width: 340px; height: 340px;
    margin: -170px 0 0 -170px;
    border-radius: 50%;
    will-change: transform, background;
  }

  /* stars */
  .stars { opacity: 0; will-change: opacity; }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
  }
  .star.big {
    width: 3px; height: 3px;
    box-shadow: 0 0 6px 2px rgba(255,255,255,.7);
    animation-duration: 4s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--o, .9); transform: scale(1); }
    50% { opacity: calc(var(--o, .9) * .25); transform: scale(.7); }
  }

  /* birds */
  .birds { will-change: opacity; }
  .bird {
    position: absolute;
    left: 0;
    width: 11px; height: 6px;
    animation: fly var(--t, 9s) linear var(--delay, 0s) infinite;
  }
  .bird svg { display: block; width: 100%; height: 100%; overflow: visible; animation: flap .45s ease-in-out infinite alternate; transform-origin: 50% 70%; }
  @keyframes fly {
    from { transform: translate(-30px, var(--y0)); }
    to   { transform: translate(420px, var(--y1)); }
  }
  @keyframes flap {
    from { transform: scaleY(1); }
    to   { transform: scaleY(-.35); }
  }

  /* sun & moon */
  .orb {
    position: absolute;
    left: 0; top: 0;
    width: 21%;
    aspect-ratio: 1;
    will-change: transform;
    pointer-events: none;
  }
  .orb > * { position: absolute; inset: 0; border-radius: 50%; }
  .sun {
    background: radial-gradient(circle at 50% 50%, #fffef6 0%, #fff8d6 40%, #ffeca6 72%, #f8d784 100%);
    box-shadow: 0 0 0 5px rgba(255,246,205,.28), 0 0 26px 6px rgba(255,238,175,.55);
  }
  .sunset {
    background: radial-gradient(circle at 50% 45%, #ffe3b0 0%, #ffb27a 45%, #ff7d4e 80%, #f2603c 100%);
    box-shadow: 0 0 0 5px rgba(255,160,110,.25), 0 0 30px 8px rgba(255,120,80,.55);
    opacity: 0;
  }
  .moon {
    background:
      radial-gradient(ellipse 22% 16% at 36% 38%, rgba(140,146,170,.32), transparent 100%),
      radial-gradient(circle at 62% 30%, rgba(140,146,170,.28) 0 5%, transparent 9%),
      radial-gradient(ellipse 26% 20% at 60% 60%, rgba(140,146,170,.34), transparent 100%),
      radial-gradient(circle at 30% 66%, rgba(140,146,170,.24) 0 5%, transparent 10%),
      radial-gradient(circle at 76% 46%, rgba(140,146,170,.22) 0 3%, transparent 7%),
      radial-gradient(circle at 46% 82%, rgba(140,146,170,.2) 0 3%, transparent 7%),
      radial-gradient(circle at 38% 34%, #ffffff 0%, #eef0f6 45%, #d7d9e3 85%, #c3c6d3 100%);
    box-shadow: 0 0 0 5px rgba(200,210,255,.08), 0 0 28px 6px rgba(190,200,255,.35), inset -4px -5px 10px rgba(80,85,120,.25);
    opacity: 0;
  }

  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }

  /* glassy inner frame */
  .frame {
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,.35),
      inset 0 0 0 1px rgba(0,0,0,.12),
      inset 0 -2px 3px rgba(255,255,255,.18);
  }
  .frame::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 10px 18px -8px rgba(255,255,255,.08);
    opacity: var(--night);
  }

  /* ---------- labels ---------- */
  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
    padding: 0 4px;
  }
  .swap { position: relative; display: grid; }
  .swap > span {
    grid-area: 1 / 1;
    transition: opacity .45s cubic-bezier(.2,.7,.2,1), filter .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1);
    white-space: nowrap;
  }
  .swap > span.off { opacity: 0; filter: blur(6px); transform: translateY(6px); }
  .swap > span.off.up { transform: translateY(-6px); }
  .title { font-size: 25px; font-weight: 600; letter-spacing: -.02em; color: var(--title); }
  .hint  { font-size: 14px; font-weight: 400; color: var(--hint); justify-items: end; }

  @media (prefers-reduced-motion: reduce) {
    .star, .bird, .bird svg { animation: none; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="track" id="track" role="switch" aria-checked="false" aria-label="Dark mode" tabindex="0">
      <div class="layer sky" id="sky"></div>
      <div class="glow" id="glow"></div>
      <div class="layer stars" id="stars"></div>
      <div class="layer birds" id="birds"></div>
      <div class="orb" id="orb">
        <div class="sun"></div>
        <div class="sunset" id="sunset"></div>
        <div class="moon" id="moon"></div>
      </div>
      <svg class="hills" viewBox="0 0 300 118" preserveAspectRatio="none" aria-hidden="true">
        <path id="hillBack" d="M0 98 C 40 92 85 91 130 95 S 220 89 300 96 V118 H0 Z" fill="#8cc29b"/>
        <path id="hillFront" d="M0 104 C 55 99 110 107 170 103 S 255 100 300 104 V118 H0 Z" fill="#6aa880"/>
        <path id="ridge" d="M0 98 C 40 92 85 91 130 95 S 220 89 300 96" fill="none" stroke="#fff" stroke-width=".6" stroke-opacity="0" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="frame"></div>
    </div>

    <div class="meta">
      <div class="swap title" aria-live="polite">
        <span id="tLight">Light mode</span>
        <span id="tDark" class="off">Dark mode</span>
      </div>
      <div class="swap hint">
        <span id="hLight">Drag the sun across</span>
        <span id="hDark" class="off">Drag the moon back</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const track = $('track'), sky = $('sky'), glow = $('glow'), orb = $('orb');
  const sunset = $('sunset'), moon = $('moon'), starsEl = $('stars'), birdsEl = $('birds');
  const hillBack = $('hillBack'), hillFront = $('hillFront'), ridge = $('ridge');
  const root = document.documentElement;

  /* ---------- color keyframes along the day → night journey ---------- */
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const K = [
    { p: 0,    top:'#3b7bd6', mid:'#6aa2e4', bot:'#b8d6f0', hb:'#8cc29b', hf:'#6aa880', card:'#ffffff', title:'#111114', hint:'#6e6e76', page:'#f2f2f5', glow:'#fffbe0', ga:.85 },
    { p: .34,  top:'#3f79d2', mid:'#76a6de', bot:'#c9dbec', hb:'#89bf98', hf:'#68a57d', card:'#ffffff', title:'#111114', hint:'#6e6e76', page:'#f2f2f5', glow:'#fff3cc', ga:.85 },
    { p: .54,  top:'#5a69a3', mid:'#c48b93', bot:'#f7b27c', hb:'#7b9a7c', hf:'#5c7c66', card:'#ffffff', title:'#111114', hint:'#6e6e76', page:'#f2f2f5', glow:'#ffab6e', ga:.8 },
    { p: .64,  top:'#2c3766', mid:'#7a5878', bot:'#d98a7c', hb:'#4b3b56', hf:'#372b43', card:'#48484e', title:'#ffffff', hint:'#c8c8cf', page:'#ececf0', glow:'#ff8c78', ga:.35 },
    { p: .8,   top:'#151a40', mid:'#2a2a55', bot:'#5f456b', hb:'#25213b', hf:'#1a1729', card:'#26262c', title:'#ffffff', hint:'#9b9ba5', page:'#ebebef', glow:'#b4beff', ga:.22 },
    { p: 1,    top:'#0b0e26', mid:'#141737', bot:'#22234a', hb:'#191a2e', hf:'#111122', card:'#16161b', title:'#ffffff', hint:'#85858f', page:'#ebebef', glow:'#bec8ff', ga:.2 },
  ].map(k => { const o = { p:k.p, ga:k.ga }; for (const key in k) if (typeof k[key] === 'string') o[key] = hex(k[key]); return o; });

  const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  function sample(p) {
    let i = 0; while (i < K.length - 2 && p > K[i+1].p) i++;
    const a = K[i], b = K[i+1], t = smooth(0, 1, clamp((p - a.p) / (b.p - a.p)));
    const out = { ga: lerp(a.ga, b.ga, t) };
    for (const key in a) if (Array.isArray(a[key])) out[key] = a[key].map((v, j) => Math.round(lerp(v, b[key][j], t)));
    return out;
  }
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ---------- stars ---------- */
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    s.style.left = (rnd() * 96 + 2) + '%';
    s.style.top = (rnd() * 62 + 4) + '%';
    const sz = rnd() < .2 ? 2 : 1.2 + rnd() * .6;
    s.style.width = s.style.height = sz + 'px';
    s.style.setProperty('--o', (.45 + rnd() * .55).toFixed(2));
    s.style.setProperty('--d', (2 + rnd() * 3).toFixed(2) + 's');
    s.style.setProperty('--delay', (-rnd() * 5).toFixed(2) + 's');
    starsEl.appendChild(s);
  }
  [[24, 22], [70, 12]].forEach(([x, y]) => {
    const s = document.createElement('i'); s.className = 'star big';
    s.style.left = x + '%'; s.style.top = y + '%'; s.style.setProperty('--delay', (-rnd()*4) + 's');
    starsEl.appendChild(s);
  });

  /* ---------- birds ---------- */
  const birdSVG = '<svg viewBox="0 0 12 6"><path d="M.6 4.2 Q3.2 .6 6 3.6 Q8.8 .6 11.4 4.2" fill="none" stroke="#23324a" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  [
    { y0: 26, y1: 18, t: 10, d: -2 },
    { y0: 34, y1: 30, t: 10.6, d: -2.7 },
    { y0: 22, y1: 26, t: 11.2, d: -3.4 },
    { y0: 40, y1: 28, t: 13, d: -9 },
  ].forEach(b => {
    const el = document.createElement('div'); el.className = 'bird'; el.innerHTML = birdSVG;
    el.style.setProperty('--y0', b.y0 + 'px'); el.style.setProperty('--y1', b.y1 + 'px');
    el.style.setProperty('--t', b.t + 's'); el.style.setProperty('--delay', b.d + 's');
    el.querySelector('svg').style.animationDelay = (-Math.random()) + 's';
    birdsEl.appendChild(el);
  });

  /* ---------- geometry ---------- */
  let W = 0, H = 0, R = 0;
  const measure = () => { const r = track.getBoundingClientRect(); W = r.width; H = r.height; R = orb.offsetWidth / 2; };
  new ResizeObserver(() => { measure(); render(p); }).observe(track);
  measure();

  const xMin = () => W * 0.22, xMax = () => W * 0.78;
  const LOW = .55; // progress where the sun meets the horizon
  function orbPos(p) {
    const x = lerp(xMin(), xMax(), p);
    const d = p - LOW, n = d < 0 ? d / LOW : d / (1 - LOW);
    const yHigh = H * 0.46, yLow = H * 0.96;
    const y = lerp(yLow, yHigh, n * n);
    return [x, y];
  }
  const pFromX = x => clamp((x - xMin()) / (xMax() - xMin()));

  /* ---------- render ---------- */
  let shownDark = null;
  function render(p) {
    const c = sample(p);
    const [x, y] = orbPos(p);
    orb.style.transform = `translate(${x - R}px, ${y - R}px)`;
    glow.style.transform = `translate(${x}px, ${y}px)`;
    glow.style.background = `radial-gradient(circle, ${rgba(c.glow, c.ga)} 0%, ${rgba(c.glow, c.ga * .45)} 22%, ${rgba(c.glow, 0)} 58%)`;
    sky.style.background = `linear-gradient(180deg, ${rgb(c.top)} 0%, ${rgb(c.mid)} 58%, ${rgb(c.bot)} 100%)`;

    const sunVis = 1 - smooth(.53, .58, p);
    orb.children[0].style.opacity = sunVis;
    sunset.style.opacity = smooth(.28, .52, p) * sunVis;
    moon.style.opacity = smooth(.56, .62, p);

    starsEl.style.opacity = smooth(.6, .92, p);
    birdsEl.style.opacity = 1 - smooth(.4, .66, p);

    hillBack.setAttribute('fill', rgb(c.hb));
    hillFront.setAttribute('fill', rgb(c.hf));
    ridge.setAttribute('stroke-opacity', (smooth(.7, 1, p) * .35).toFixed(3));

    const night = smooth(.58, .9, p);
    root.style.setProperty('--night', night.toFixed(3));
    root.style.setProperty('--card', rgb(c.card));
    root.style.setProperty('--title', rgb(c.title));
    root.style.setProperty('--hint', rgb(c.hint));
    root.style.setProperty('--page', rgb(c.page));

    const dark = p > .5;
    if (dark !== shownDark) {
      shownDark = dark;
      swap($('tLight'), $('tDark'), dark);
      swap($('hLight'), $('hDark'), dark);
      track.setAttribute('aria-checked', String(dark));
    }
  }
  function swap(a, b, dark) {
    a.classList.toggle('off', dark); a.classList.toggle('up', dark);
    b.classList.toggle('off', !dark); b.classList.remove('up');
  }

  /* ---------- spring animation ---------- */
  let p = 0, v = 0, target = 0, raf = 0, last = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const K_STIFF = 38, DAMP = 2 * Math.sqrt(K_STIFF) * 1.0;
  function animateTo(t, vel = 0) {
    target = t; v = vel;
    if (reduce) { p = t; v = 0; render(p); return; }
    cancelAnimationFrame(raf); last = performance.now();
    raf = requestAnimationFrame(step);
  }
  function step(now) {
    let dt = Math.min(.032, (now - last) / 1000); last = now;
    // sub-step for stability
    for (let i = 0; i < 4; i++) {
      const h = dt / 4;
      const a = -K_STIFF * (p - target) - DAMP * v;
      v += a * h; p += v * h;
    }
    p = clamp(p, -0.02, 1.02);
    if (Math.abs(p - target) < 0.0006 && Math.abs(v) < 0.002) { p = target; v = 0; render(p); return; }
    render(clamp(p));
    raf = requestAnimationFrame(step);
  }

  /* ---------- dragging ---------- */
  let drag = null;
  track.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    cancelAnimationFrame(raf);
    const r = track.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const [ox, oy] = orbPos(p);
    const onOrb = Math.hypot(px - ox, py - oy) < R * 1.5;
    drag = { startX: e.clientX, moved: false, offset: onOrb ? px - ox : 0, onOrb, samples: [[performance.now(), p]] };
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.abs(e.clientX - drag.startX) < 4) return;
    if (!drag.moved) {
      drag.moved = true; track.classList.add('dragging');
      if (!drag.onOrb) { const [ox] = orbPos(p); drag.offset = (e.clientX - track.getBoundingClientRect().left) - ox; }
    }
    const r = track.getBoundingClientRect();
    p = pFromX(e.clientX - r.left - drag.offset);
    const now = performance.now();
    drag.samples.push([now, p]);
    while (drag.samples.length > 2 && now - drag.samples[0][0] > 90) drag.samples.shift();
    render(p);
  });
  const end = e => {
    if (!drag) return;
    track.classList.remove('dragging');
    if (!drag.moved) { animateTo(target > .5 ? 0 : 1); drag = null; return; }
    const s = drag.samples, a = s[0], b = s[s.length - 1];
    const vel = b[0] > a[0] ? (b[1] - a[1]) / ((b[0] - a[0]) / 1000) : 0;
    let t = p > .5 ? 1 : 0;
    if (Math.abs(vel) > 0.9) t = vel > 0 ? 1 : 0;
    drag = null;
    animateTo(t, clamp(vel, -4, 4));
  };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);

  track.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); animateTo(target > .5 ? 0 : 1); }
    else if (e.key === 'ArrowRight') animateTo(1);
    else if (e.key === 'ArrowLeft') animateTo(0);
  });

  render(p);
})();
</script>
</body>
</html>
